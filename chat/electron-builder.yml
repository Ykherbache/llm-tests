appId: com.local.chat
productName: Local Chat
directories:
  output: release
files:
  - electron/dist/main.js
  - electron/dist/preload.js
  - package.json
extraMetadata:
  main: electron/dist/main.js
# The Next.js standalone server runs as a separate process, so it ships as plain
# resources (outside the asar) next to the app. build:desktop already copies .next/static into it.
extraResources:
  - from: .next/standalone
    to: server
  # electron-builder drops any node_modules folder it finds inside another extraResources entry, and
  # the server then dies at startup with "Cannot find module 'next'". Copy it as its own entry.
  - from: .next/standalone/node_modules
    to: server/node_modules
# The legacy AppImage runtime links an unversioned libz.so that Fedora (and others) only ship in
# -devel packages; the newer runtime is static.
toolsets:
  appimage: "1.0.3"
win:
  target:
    - target: nsis
      arch: x64
# AppImage is the one Linux format electron-updater can replace in place. arm64 covers Asahi.
linux:
  artifactName: Local-Chat-${version}-${arch}.${ext}
  category: Utility
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
nsis:
  oneClick: true
  perMachine: false
publish:
  provider: github
  owner: Ykherbache
  repo: llm-tests
  releaseType: draft
