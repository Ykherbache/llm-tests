name: release-desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # One at a time: parallel jobs would race to create the same GitHub release and end up with two.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: ubuntu-latest
            args: --linux --x64 --arm64
          - os: macos-latest
            args: --mac --arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: chat
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The tag (v0.1.0) is the app version: electron-updater compares it to the installed one.
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run build:desktop
      - run: npm run electron:bundle
      - run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
